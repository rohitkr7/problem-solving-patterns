<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Problem Solving Patterns — 26 Essential DSA Patterns for Coding Interviews</title>
  <meta name="description" content="A comprehensive reference guide of 26 core algorithmic patterns with visual strategies, explanations, and Java solutions for LeetCode and technical interviews.">
  <meta name="author" content="Rohit Roy">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338BDF8'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">

  <!-- Open Graph -->
  <meta property="og:title" content="Problem Solving Patterns — 26 DSA Patterns">
  <meta property="og:description" content="A comprehensive reference guide of 26 core algorithmic patterns with visual strategies, explanations, and Java solutions.">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Prism.js Syntax Highlighting Theme -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

  <!-- App Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Theme init script to avoid flicker -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dsa_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <!-- Header Navbar -->
  <header class="site-header">
    <div class="header-left">
      <button class="sidebar-toggle-btn" id="sidebarToggle" type="button" aria-label="Toggle pattern menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <a href="#home" class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </div>
        <span>Problem Solving Patterns</span>
        <span class="brand-badge">26 Patterns</span>
      </a>
    </div>

    <!-- Center Search Bar Trigger -->
    <div class="header-center">
      <button class="search-trigger" id="searchTrigger" type="button">
        <div class="search-trigger-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Search patterns, problems, algorithms...</span>
        </div>
        <kbd class="search-kbd">⌘K</kbd>
      </button>
    </div>

    <!-- Header Navigation & Actions -->
    <div class="header-right">
      <a href="https://rohitkr7.github.io/" class="header-nav-link" title="Rohit's Portfolio">
        <span>Portfolio</span>
      </a>
      <a href="https://rohitkr7.github.io/leetcode-viewer/" class="header-nav-link accent-link" title="LeetCode Solutions">
        <span>LeetCode ↗</span>
      </a>
      <a href="https://github.com/rohitkr7/Problem-Solving-Patterns" target="_blank" rel="noopener noreferrer" class="icon-btn" title="View Source on GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle Color Theme" title="Toggle dark/light theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <!-- App Body Layout -->
  <div class="app-container">
    <!-- Left Sidebar: Patterns List -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="progress-card">
          <div class="progress-header">
            <span>Learning Mastery</span>
            <span class="progress-value" id="progressCount">0 / 26 (0%)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <div class="sidebar-filter">
        <input type="text" id="patternFilterInput" class="filter-input" placeholder="Filter 26 patterns..." aria-label="Filter patterns">
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Injected dynamically by app.js -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <div class="main-content" id="mainContent">
        <!-- Injected dynamically by app.js -->
      </div>
    </main>

    <!-- Right Sticky TOC -->
    <aside class="toc-sidebar" id="tocContainer" style="display: none;">
      <div class="toc-title">On This Page</div>
      <ul class="toc-list" id="tocList">
        <!-- Injected dynamically by app.js -->
      </ul>
    </aside>
  </div>

  <!-- Search Modal -->
  <div class="search-modal-backdrop" id="searchModalBackdrop">
    <div class="search-modal">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search patterns, problem names, algorithmic tricks..." autocomplete="off">
        <kbd class="search-kbd">ESC</kbd>
      </div>
      <ul class="search-results-list" id="searchResultsList">
        <!-- Injected dynamically -->
      </ul>
      <div class="search-footer">
        <span>Navigate <kbd class="search-kbd">↑</kbd> <kbd class="search-kbd">↓</kbd></span>
        <span>Select <kbd class="search-kbd">↵</kbd></span>
        <span>Close <kbd class="search-kbd">ESC</kbd></span>
      </div>
    </div>
  </div>

  <!-- External Libraries -->
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Prism.js Syntax Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

  <!-- Preloaded Data Store -->
  <script src="data/patterns-data.js"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
